name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-check:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run all assert suites and loopback integration checks
        run: python -m tests.self_check
      - name: Check simulation CLI
        run: python -m bb84_lab.simulation bb84
      - name: Check dashboard and network entry points
        run: |
          python -m bb84_lab.local --help
          python -m bb84_lab.network --help
          python -m bb84_lab.network init --help
          python -m bb84_lab.network alice --help
          python -m bb84_lab.network bob --help
          python -m bb84_lab.network eve --help
      - name: Run reproducible smoke study
        run: python -m bb84_lab.research.study --quick --no-plots --output outputs/ci-study
      - name: Check patch whitespace
        run: git diff --check
